# Un solo origen para web y móvil: http://<servidor>/ es la web y http://<servidor>/api es la API Go.
# Las variables + resolver de Docker evitan que nginx se caiga al arrancar si un servicio aún no existe.
resolver 127.0.0.11 valid=10s;

# Detrás de Cloudflare: la IP del visitante llega en CF-Connecting-IP y el esquema real (https) en X-Forwarded-Proto.
# Sin Cloudflare esas cabeceras no existen y se usan la IP de la conexión y el esquema propio.
map $http_cf_connecting_ip $ip_cliente { default $http_cf_connecting_ip; "" $remote_addr; }
map $http_x_forwarded_proto $esquema { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;
    client_max_body_size 45m; # el portal envía varios adjuntos de hasta 8 MB (el backend limita a 40 MB)

    # El cliente real va en X-Forwarded-For (se sobrescribe, no se acumula). Si el puerto 80 de la EC2 solo admite
    # las IP de Cloudflare (Security Group), nadie puede falsear CF-Connecting-IP.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $ip_cliente;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $esquema;
    proxy_read_timeout 120s;

    location /api/ {
        set $api http://backend:8080;
        proxy_pass $api;
    }

    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
    }
}
