# Un solo origen para web y móvil: http://<servidor>/ es la web y http://<servidor>/api es la API Go.
# Las variables + resolver de Docker evitan que nginx se caiga al arrancar si un servicio aún no existe.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    client_max_body_size 45m; # el portal envía varios adjuntos de hasta 8 MB (el backend limita a 40 MB)

    # El cliente real va en X-Forwarded-For (se sobrescribe: nadie de afuera puede falsearlo).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ {
        set $api http://backend:8080;
        proxy_pass $api;
    }

    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
    }
}
